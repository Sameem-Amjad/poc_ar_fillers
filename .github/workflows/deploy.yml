name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Build & Push Images ────────────────────────────────────────────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      frontend-image: ${{ steps.names.outputs.frontend }}
      backend-image:  ${{ steps.names.outputs.backend }}

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image names
        id: names
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "frontend=${{ env.REGISTRY }}/${REPO}/frontend" >> $GITHUB_OUTPUT
          echo "backend=${{ env.REGISTRY }}/${REPO}/backend"  >> $GITHUB_OUTPUT

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context:    ./frontend
          push:       ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.names.outputs.frontend }}:latest
            ${{ steps.names.outputs.frontend }}:${{ github.sha }}
          build-args: VITE_API_URL=
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context:    ./backend
          push:       ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.names.outputs.backend }}:latest
            ${{ steps.names.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

  # ─── Deploy to EC2 ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      # Free disk and ensure the target exists BEFORE copying — the post-
      # deploy prune never runs when deploys fail, so a full disk otherwise
      # wedges the pipeline permanently (scp exits 1 on extract).
      - name: Prepare server (disk space + target dir)
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/poc_ar_filter
            echo "disk before cleanup:" && df -h / | tail -1
            docker image prune -af || true
            docker builder prune -af || true
            docker container prune -f || true
            sudo journalctl --vacuum-size=100M 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || true
            echo "disk after cleanup:" && df -h / | tail -1

      # Copy only the files the server needs (no source code)
      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "docker-compose.yml,Caddyfile"
          target:   "~/poc_ar_filter"

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/poc_ar_filter

            # Authenticate with GHCR using the run's own GITHUB_TOKEN —
            # never expires mid-lifecycle (unlike a PAT), and the pull
            # happens during the run while the token is valid.
            echo "${{ github.token }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Update image references in .env
            REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            sed -i "s|FRONTEND_IMAGE=.*|FRONTEND_IMAGE=ghcr.io/${REPO}/frontend:${{ github.sha }}|" .env
            sed -i "s|BACKEND_IMAGE=.*|BACKEND_IMAGE=ghcr.io/${REPO}/backend:${{ github.sha }}|"  .env

            # Sync database config from GitHub secrets.
            # No secret → blank the value so compose falls back to SQLite —
            # a stale/dead DB URL must never crash-loop the backend.
            set_env () {
              grep -q "^$1=" .env && sed -i "s|^$1=.*|$1=$2|" .env || echo "$1=$2" >> .env
            }
            set_env DATABASE_URL "${{ secrets.DATABASE_URL }}"
            set_env SUPABASE_URL "${{ secrets.SUPABASE_URL }}"
            set_env SUPABASE_KEY "${{ secrets.SUPABASE_KEY }}"

            # Pull new images
            docker compose pull

            # Rolling restart — zero downtime
            docker compose up -d --remove-orphans

            # Health check — hit backend directly (nginx may not be configured yet)
            sleep 8
            curl --fail --silent http://localhost:8001/health | grep -q '"ok"'

            # Prune old images
            docker image prune -f

            echo "Deployment complete — sha ${{ github.sha }}"

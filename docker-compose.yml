services:

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"   # only accessible locally — nginx proxies here

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000" # only accessible locally — nginx proxies here
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/poc_ar_filter.db}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - sqlite_data:/app/data

  # Touch the database every 6h so a free-tier Supabase project never
  # auto-pauses (paused projects take the whole backend down with them).
  keepalive:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - backend
    command: >
      sh -c 'while true; do
        curl -fsS http://backend:8000/api/sessions/ >/dev/null 2>&1 || true;
        sleep 21600;
      done'

volumes:
  sqlite_data:

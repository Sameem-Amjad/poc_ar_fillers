services:

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"   # only accessible locally — nginx proxies here

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000" # only accessible locally — nginx proxies here
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/poc_ar_filter.db}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
